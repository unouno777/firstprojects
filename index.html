<script>
// ════════════════════════════════════════════════════════════════
// STORAGE  — Firestore がメイン / LocalStorage はセッションのみ
// ════════════════════════════════════════════════════════════════
const SES_KEY = 'sm_session';   // LocalStorageに残す（ログイン状態のみ）

const db = {
  // ── セッション（LocalStorage） ────────────────────────────────
  session:    () => { try{return JSON.parse(localStorage.getItem(SES_KEY)||'null')}catch{return null} },
  saveSes:  (s)  => localStorage.setItem(SES_KEY, JSON.stringify(s)),
  clearSes: ()   => localStorage.removeItem(SES_KEY),
  hardReset:()   => { localStorage.removeItem(SES_KEY); },

  // ── ワークスペース（Firestore） ────────────────────────────────
  // 書き込み: wsオブジェクト全体をFirestoreに保存
  saveOneWS: async (ws) => {
    try {
      await fsWS(ws.id).set(ws);
    } catch(e) {
      console.error('saveOneWS failed:', e);
      toast('保存に失敗しました。通信環境を確認してください。');
    }
  },

  // ── アクティビティログ（Firestore） ───────────────────────────
  appendLog: async (wsId, empId, entry) => {
    try {
      const ref  = fsLog(wsId, empId);
      const snap = await ref.get();
      const prev = snap.exists ? (snap.data().entries || []) : [];
      const next = [entry, ...prev].slice(0, 50);
      await ref.set({ entries: next });
    } catch(e) {
      console.error('appendLog failed:', e);
    }
  },

  // ── ログ読み込み（Firestore） ─────────────────────────────────
  getLogs: async (wsId, empId) => {
    try {
      const snap = await fsLog(wsId, empId).get();
      return snap.exists ? (snap.data().entries || []) : [];
    } catch(e) { return []; }
  },
};

// ── リアルタイムリスナー管理 ───────────────────────────────────
let _unsubscribeWS = null;  // Firestore onSnapshot の解除関数

function subscribeWorkspace(wsId) {
  // 既存リスナーを解除
  if(_unsubscribeWS) { _unsubscribeWS(); _unsubscribeWS = null; }

  _unsubscribeWS = fsWS(wsId).onSnapshot((snap) => {
    if(!snap.exists) return;
    const fresh = snap.data();

    // state.ws を最新データで更新
    state.ws = fresh;

    // セッションのwsRoleも同期
    if(state.session) {
      const me = (fresh.employees||[]).find(e=>e.id===state.session.employeeId);
      if(me) {
        const newRole = me.wsRole==='admin' ? 'admin' : 'employee';
        if(state.session.role !== newRole) {
          state.session.role = newRole;
          db.saveSes(state.session);
        }
      }
    }

    // 画面を再描画（アプリ起動中のみ）
    if(state.screen === 'app') {
      // タブコンテンツのみ再描画（ヘッダー等のちらつきを防ぐ）
      const el = document.getElementById('tab-content');
      if(el) {
        renderTabContent();
      } else {
        renderApp();
      }
      // 承認バッジのカウントも更新
      updatePendingBadge();
    }
  }, (err) => {
    console.error('onSnapshot error:', err);
  });
}

function updatePendingBadge() {
  const ws = getWS();
  if(!ws || !isAdmin()) return;
  const count = (ws.approvals||[]).filter(a=>a.status==='pending').length;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    if(btn.textContent.includes('承認')) {
      btn.innerHTML = '承認管理' + (count > 0 ? `<span class="badge">${count}</span>` : '');
    }
  });
}

// ════════════════════════════════════════════════════════════════
// CONSTANTS
// ════════════════════════════════════════════════════════════════
const SKILLS = [
  {id:'fe',  label:'フロントエンド',   short:'FE',  color:'#3b82f6'},
  {id:'be',  label:'バックエンド',     short:'BE',  color:'#8b5cf6'},
  {id:'mgt', label:'育成・マネジメント',short:'MGT', color:'#10b981'},
  {id:'mkt', label:'マーケティング',   short:'MKT', color:'#f59e0b'},
  {id:'sls', label:'営業・交渉',       short:'SLS', color:'#ef4444'},
  {id:'dat', label:'データ分析',       short:'DAT', color:'#06b6d4'},
];

const LEVELS = [
  {lv:1,name:'ビギナー',  icon:'🌱',color:'#64748b'},
  {lv:2,name:'アマチュア',icon:'📘',color:'#3b82f6'},
  {lv:3,name:'セミプロ',  icon:'⚡',color:'#10b981'},
  {lv:4,name:'プロ',      icon:'🏆',color:'#f59e0b'},
  {lv:5,name:'マスター',  icon:'👑',color:'#7c3aed'},
];

const HEAT = [
  {bg:'#f8fafc',text:'#94a3b8'},
  {bg:'#fff1f2',text:'#be123c'},
  {bg:'#fff7ed',text:'#c2410c'},
  {bg:'#fefce8',text:'#854d0e'},
  {bg:'#f0fdf4',text:'#166534'},
  {bg:'#d1fae5',text:'#065f46'},
];

const RANK_TIERS = [
  {code:'J1',label:'新入社員',    minMax:4,  minAvg:0,   color:'#64748b',bg:'#f1f5f9'},
  {code:'J2',label:'ジュニア',    minMax:2,  minAvg:1.5, color:'#10b981',bg:'#f0fdf4'},
  {code:'J3',label:'ミドル',      minMax:3,  minAvg:2.5, color:'#3b82f6',bg:'#eff6ff'},
  {code:'J4',label:'シニア',      minMax:4,  minAvg:3.0, color:'#7c3aed',bg:'#f5f3ff'},
  {code:'J5',label:'エグゼクティブ',minMax:5, minAvg:3.5, color:'#d97706',bg:'#fffbeb'},
];

function getRank(skills) {
  const vals = Object.values(skills);
  const max  = Math.max(...vals);
  const avg  = vals.reduce((a,b)=>a+b,0)/vals.length;
  for(let i=RANK_TIERS.length-1;i>=0;i--){
    const t=RANK_TIERS[i];
    if(max>=t.minMax && avg>=t.minAvg) return t;
  }
  return RANK_TIERS[0];
}

function defaultSkills(customSkills) {
  const cats = customSkills || SKILLS;
  return Object.fromEntries(cats.map(c=>[c.id,1]));
}

function genCode() {
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return 'INV-'+[...Array(4)].map(()=>c[Math.floor(Math.random()*c.length)]).join('');
}

let nextId = 100 + Math.floor(Math.random()*900);

// ════════════════════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════════════════════
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2500);

// ════════════════════════════════════════════════════════════════
// SVG RADAR (hexagonal)
// ════════════════════════════════════════════════════════════════
function makeRadar(skills, cats, size) {
  size = size || 260;
  const cx=size/2, cy=size/2, R=size*0.33, N=cats.length;
  const pt=(i,r)=>{
    const a=(Math.PI*2*i)/N - Math.PI/2;
    return [cx+r*Math.cos(a), cy+r*Math.sin(a)];
  };

  let svg = `<svg class="radar" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  svg += `<defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
  </linearGradient></defs>`;

  // Grid rings
  [1,2,3,4,5].forEach(r=>{
    const pts=cats.map((_,i)=>pt(i,(r/5)*R));
    const d=pts.map(([x,y],i)=>`${i===0?'M':'L'}${x},${y}`).join(' ')+'Z';
    svg+=`<path d="${d}" fill="none" stroke="${r===5?'#94a3b8':'#e2e8f0'}" stroke-width="${r===5?1.5:1}"/>`;
  });
  // Axes
  cats.forEach((_,i)=>{
    const [ex,ey]=pt(i,R);
    svg+=`<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="#e2e8f0" stroke-width="1"/>`;
  });
  // Skill polygon
  const skillPts=cats.map((cat,i)=>pt(i,((skills[cat.id]||1)/5)*R));
  const polyD=skillPts.map(([x,y],i)=>`${i===0?'M':'L'}${x},${y}`).join(' ')+'Z';
  svg+=`<path d="${polyD}" fill="url(#rg)" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round"/>`;
  // Dots
  skillPts.forEach(([x,y],i)=>{
    svg+=`<circle cx="${x}" cy="${y}" r="5" fill="${cats[i].color}" stroke="#fff" stroke-width="2"/>`;
  });
  // Labels
  const LR=R+28;
  cats.forEach((cat,i)=>{
    const [lx,ly]=pt(i,LR);
    const anchor=lx<cx-5?'end':lx>cx+5?'start':'middle';
    const dy=ly<cy-5?-6:ly>cy+5?14:5;
    const lv=skills[cat.id]||1;
    svg+=`<text x="${lx}" y="${ly+dy-9}" text-anchor="${anchor}" font-size="10" font-weight="700" font-family="system-ui" fill="#374151">${cat.short}</text>`;
    svg+=`<text x="${lx}" y="${ly+dy+3}" text-anchor="${anchor}" font-size="11" font-weight="900" font-family="system-ui" fill="${cat.color}">Lv.${lv}</text>`;
  });
  svg+=`<circle cx="${cx}" cy="${cy}" r="3" fill="#94a3b8"/>`;
  svg+='</svg>';
  return svg;
}

// ════════════════════════════════════════════════════════════════
// AVATAR (emoji-based, 5 tiers)
// ════════════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════════════
// SVG AVATAR  — 5段階コスチューム変化
// tier 1: ポロシャツ+チノパン(新入社員)
// tier 2: ワイシャツ+スラックス
// tier 3: スーツ(ネクタイなし)+眼鏡
// tier 4: スーツ+ネクタイ
// tier 5: 3ピース+ポケットチーフ+オーラ
// ════════════════════════════════════════════════════════════════
function makeSvgAvatar(tier, sizePx) {
  sizePx = sizePx || 80;
  const s = 180; // internal viewBox
  const cx = 90, cy = 90;

  const themes = [
    // J1 polo
    {skin:'#FDBCB4',skinD:'#F4A99E',hair:'#2d1a0e',
     shirt:'#7EB8E8',shirtD:'#5A9FD4',pants:'#C8B99A',pantsD:'#B5A48A',
     jacket:null,tie:null,vest:null,pocket:null,glasses:false,
     bg1:'#EFF6FF',bg2:'#DBEAFE'},
    // J2 shirt+slacks
    {skin:'#FDBCB4',skinD:'#F4A99E',hair:'#2d1a0e',
     shirt:'#FFFFFF',shirtD:'#E5E7EB',pants:'#4B5563',pantsD:'#374151',
     jacket:null,tie:null,vest:null,pocket:null,glasses:false,
     bg1:'#F0FDF4',bg2:'#DCFCE7'},
    // J3 suit no tie + glasses
    {skin:'#FDBCB4',skinD:'#F4A99E',hair:'#1a1a1a',
     shirt:'#F9FAFB',shirtD:'#E5E7EB',pants:'#1E3A5F',pantsD:'#162D4A',
     jacket:'#1E3A5F',jacketD:'#162D4A',tie:null,vest:null,pocket:null,glasses:true,
     bg1:'#EFF6FF',bg2:'#BFDBFE'},
    // J4 suit + tie
    {skin:'#FDBCB4',skinD:'#F4A99E',hair:'#111111',
     shirt:'#FFFFFF',shirtD:'#F3F4F6',pants:'#1C1C2E',pantsD:'#111118',
     jacket:'#1C1C2E',jacketD:'#111118',tie:'#C0392B',tieD:'#922B21',
     vest:null,pocket:null,glasses:true,
     bg1:'#F5F3FF',bg2:'#DDD6FE'},
    // J5 3-piece + pocket square + silver streak
    {skin:'#FDBCB4',skinD:'#F4A99E',hair:'#0a0a0a',hairS:'#CBD5E1',
     shirt:'#FFFBEB',shirtD:'#FEF3C7',pants:'#111827',pantsD:'#0a0f1a',
     jacket:'#111827',jacketD:'#0a0f1a',tie:'#92400E',tieD:'#6B2D0A',
     vest:'#1F2937',vestD:'#111827',pocket:'#FCD34D',glasses:true,
     bg1:'#FFF7ED',bg2:'#FDE68A'},
  ];

  const t  = themes[Math.min(tier-1, 4)];
  const hasJ = !!t.jacket;
  const hasV = !!t.vest;

  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${sizePx}" height="${sizePx}" viewBox="0 0 ${s} ${s}">`;

      svg += `<line x1="102" y1="88" x2="102" y2="82" stroke="${t.pocket}" stroke-width="2.5"/>`;

  }

  // Tie
  if(t.tie){
    svg += `<polygon points="86,82 94,82 96,100 90,122 84,100" fill="${t.tie}"/>`;
  }

  // Arms
  svg += `<rect x="42" y="84" width="22" height="36" rx="7" fill="${hasJ?t.jacket:t.shirt}"/>`;
  svg += `<rect x="116" y="84" width="22" height="36" rx="7" fill="${hasJ?t.jacket:t.shirt}"/>`;
  svg += `<rect x="42" y="112" width="22" height="8" rx="4" fill="${t.shirt}"/>`;
  svg += `<rect x="116" y="112" width="22" height="8" rx="4" fill="${t.shirt}"/>`;
  svg += `<ellipse cx="53" cy="124" rx="9" ry="7" fill="url(#sk${tier})"/>`;
  svg += `<ellipse cx="127" cy="124" rx="9" ry="7" fill="url(#sk${tier})"/>`;

  // Neck
  svg += `<rect cx="90" y="70" x="82" width="16" height="16" rx="5" fill="url(#sk${tier})"/>`;

  // Head
  svg += `<ellipse cx="${cx}" cy="52" rx="27" ry="29" fill="url(#sk${tier})"/>`;
  svg += `<ellipse cx="63" cy="54" rx="5" ry="8" fill="${t.skinD}"/>`;
  svg += `<ellipse cx="117" cy="54" rx="5" ry="8" fill="${t.skinD}"/>`;

  // Hair
  svg += `<ellipse cx="${cx}" cy="28" rx="25" ry="15" fill="${t.hair}"/>`;
  svg += `<ellipse cx="70" cy="38" rx="12" ry="16" fill="${t.hair}"/>`;
  svg += `<ellipse cx="110" cy="38" rx="12" ry="16" fill="${t.hair}"/>`;
  if(t.hairS){
    svg += `<path d="M 84 20 Q 90 14 96 20" stroke="${t.hairS}" stroke-width="3" fill="none" opacity="0.8"/>`;
  }

  // Eyes
  svg += `<ellipse cx="80" cy="52" rx="4" ry="4.5" fill="#fff"/>`;
  svg += `<ellipse cx="100" cy="52" rx="4" ry="4.5" fill="#fff"/>`;

  svg += `<path d="M 74 44 Q 80 41 86 44" stroke="${t.hair}" stroke-width="2" fill="none" stroke-linecap="round"/>`;

  svg += `<path d="M 87 58 Q 90 62 93 58" stroke="${t.skinD}" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;

window.addEventListener('DOMContentLoaded', async ()=>{
  // ── Check for invite URL ──────────────────────────────────────
  const hash = location.hash;
  if(hash.startsWith('#invite=')) {
    try {
      const encoded = hash.slice('#invite='.length);
      const json    = decodeURIComponent(
        atob(encoded).split('').map(c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0')).join('')
      );
      const wsSnap = JSON.parse(json);
      if(wsSnap && wsSnap.id && wsSnap.inviteCode) {
        // Save to Firestore（まだ存在しない場合のみ）
        const existing = await fsWS(wsSnap.id).get();
        if(!existing.exists) {
          await db.saveOneWS(wsSnap);
        }
        history.replaceState(null, '', location.pathname);
        const ses = db.session();
        if(!ses) {
          renderLanding();
          showLandingView('join');
          setTimeout(()=>{
            const inp = document.getElementById('inv-code');
            if(inp) inp.value = wsSnap.inviteCode;
          }, 50);
          return;
        }
      }
    } catch(e) { console.warn('invite URL parse error:', e); }
  }

  // ── Restore session ───────────────────────────────────────────
  const ses = db.session();
  if(ses && ses.wsId) {
    // Firestoreから最新のWSデータを取得
    try {
      const snap = await fsWS(ses.wsId).get();
      if(snap.exists) {
        state.session = ses;
        state.ws      = snap.data();
        state.screen  = 'app';

        // wsRoleを同期
        const me = getEmps().find(e=>e.id===ses.employeeId);
        if(me) {
          state.session.role = me.wsRole==='admin' ? 'admin' : 'employee';
          db.saveSes(state.session);
        }

        state.activeTab     = isAdmin() ? 'members' : 'mypage';
        state.selectedEmpId = isAdmin() ? (getEmps()[0]||{}).id : null;

        // リアルタイムリスナーを張る
        subscribeWorkspace(ses.wsId);
      } else {
        // Firestoreに存在しない → セッションクリアしてランディングへ
        db.clearSes();
      }
    } catch(e) {
      console.error('Failed to load workspace:', e);
      toast('データの読み込みに失敗しました。通信を確認してください。');
    }
  }

  rerender();
});

async function doCreate() {

  if(!wsName || !adminName) { toast('グループ名と名前を入力してください'); return; }
  const wsId  = 'ws_'+Date.now();
  const empId = nextId++;
  const code  = genCode();
  const ws = {
    id:wsId, name:wsName, inviteCode:code, adminEmpId:empId,
    employees:[{id:empId, name:adminName, role:'管理者', wsRole:'admin', skills:defaultSkills()}],
    quests:[], approvals:[], createdAt:Date.now(),

async function doJoin() {
  const raw   = (document.getElementById('inv-code').value||'').trim().toUpperCase().replace(/\s/g,'');
  const name  = document.getElementById('join-name').value.trim();
  const role  = document.getElementById('join-role').value.trim() || 'スタッフ';
  const errEl = document.getElementById('join-err');
  errEl.textContent = '';
  if(!raw)  { errEl.textContent='招待コードを入力してください'; return; }
  if(!name) { errEl.textContent='名前を入力してください'; return; }

  // Firestoreで招待コードを検索
  errEl.textContent = '🔍 検索中...';
  try {
    const normalize = s => s.toUpperCase().replace(/[-\s]/g,'');
    const snap = await firestore.collection('workspaces')
      .where('inviteCode', '==', raw)
      .limit(1)
      .get();

    let ws = null;
    if(!snap.empty) {
      ws = snap.docs[0].data();
    } else {
      // ハイフンなし形式でも試す
      const snap2 = await firestore.collection('workspaces').get();
      snap2.forEach(doc => {
        const d = doc.data();
        if(normalize(d.inviteCode) === normalize(raw)) ws = d;
      });
    }

    if(!ws) {
      errEl.textContent = `招待コード「${raw}」が見つかりません。管理者から送られた「参加用URL」を使ってください。`;
      return;
    }

    const empId  = nextId++;
    const newEmp = {id:empId, name, role, wsRole:'employee', skills:defaultSkills()};
    ws.employees = [...(ws.employees||[]), newEmp];
    await db.saveOneWS(ws);   // Firestoreに保存（全員に反映）

    state.ws      = ws;
    state.session = {wsId:ws.id, role:'employee', employeeId:empId};
    db.saveSes(state.session);
    subscribeWorkspace(ws.id); // リアルタイムリスナー開始
    enterApp();
  } catch(e) {
    console.error('doJoin error:', e);
    errEl.textContent = '通信エラーが発生しました。インターネット接続を確認してください。';
  }
}

async function reenterWS(wsId) {
  try {
    const snap = await fsWS(wsId).get();
    if(!snap.exists) { toast('グループが見つかりません'); return; }
    const ws       = snap.data();
    const adminEmp = (ws.employees||[]).find(e=>e.wsRole==='admin') || ws.employees[0];
    if(!adminEmp) return;
    state.ws      = ws;
    state.session = {wsId, role:'admin', employeeId:adminEmp.id};
    db.saveSes(state.session);
    subscribeWorkspace(wsId);
    enterApp();
  } catch(e) {
    console.error('reenterWS error:', e);
    toast('接続に失敗しました');
  }
}

function enterApp() {
  state.screen    = 'app';
  state.activeTab = isAdmin() ? 'members' : 'mypage';
  if(isAdmin()) state.selectedEmpId = (getEmps()[0]||{}).id;
  // 最近使ったWSをLocalStorageに記録（再入室用）
  if(state.ws) {
    const recent = JSON.parse(localStorage.getItem('sm_recent_ws')||'[]');
    const updated = [state.ws.id, ...recent.filter(id=>id!==state.ws.id)].slice(0,5);
    localStorage.setItem('sm_recent_ws', JSON.stringify(updated));
  }
  rerender();
}

function copyCode(code) {
  if(navigator.clipboard) navigator.clipboard.writeText(code).then(()=>toast('コピーしました！'));
  else toast(code);
}

function copyInviteUrl(wsId) {
  const targetId = wsId || (state.ws && state.ws.id);
  const ws = targetId ? (db._wsCache && db._wsCache[targetId]) || state.ws : state.ws;
  if(!ws) { showUrlModal(null, null); return; }

  try {
    const json    = JSON.stringify(ws);
    const encoded = btoa(encodeURIComponent(json).replace(
      /%([0-9A-F]{2})/g, (_, p) => String.fromCharCode(parseInt(p, 16))
    ));
    const url = location.origin + location.pathname + '#invite=' + encoded;
    showUrlModal(url, ws.name);
  } catch(e) {
    console.error('copyInviteUrl:', e);
    showUrlModal(null, null);
  }
}

        <button onclick="document.getElementById('url-modal').remove()"

      <div style="text-align:center;margin-bottom:16px">
        <div style="font-size:18px;font-weight:900;color:#1e293b">🔗 参加用URL</div>
        <div style="font-size:12px;color:#64748b;margin-top:4px">${wsName ? esc(wsName)+'への招待' : '招待リンク'}</div>
      </div>

      <!-- URL表示エリア：長押しコピー用 -->
      <div style="background:#f1f5f9;border:1.5px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:14px;word-break:break-all;font-size:12px;color:#1e40af;line-height:1.6;user-select:all;-webkit-user-select:all"
           id="invite-url-text">${url}</div>

      <p style="font-size:11px;color:#94a3b8;text-align:center;margin-bottom:14px">
        ↑ URLを長押し→「コピー」で手動コピーできます
      </p>

      <!-- ボタン群 -->
      <div style="display:flex;flex-direction:column;gap:8px">

        <!-- ① iOSネイティブ共有シート（最も確実） -->
        <button id="btn-share" onclick="doNativeShare('${url.replace(/'/g,"\\'")}','${wsName ? wsName.replace(/'/g,"\\'") : ''}')"
          style="width:100%;padding:14px;background:linear-gradient(90deg,#1e3a8a,#3b82f6);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700">
          📤 LINEやメールで送る（共有）
        </button>

        <!-- ② クリップボードコピー -->
        <button id="btn-copy" onclick="doClipboardCopy()"
          style="width:100%;padding:12px;background:#f8fafc;color:#1e3a8a;border:1.5px solid #1e3a8a;border-radius:12px;font-size:14px;font-weight:700">
          📋 クリップボードにコピー
        </button>

        <button onclick="document.getElementById('url-modal').remove()"
          style="width:100%;padding:10px;background:none;color:#94a3b8;border:none;font-size:13px">
          閉じる
        </button>
      </div>
    </div>`;

  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if(e.target===modal) modal.remove(); });

  // ── 共有ボタン：navigator.share が使えない環境では非表示 ──
  if(!navigator.share) {
    const btn = document.getElementById('btn-share');
    if(btn) btn.style.display = 'none';
  }

  // ── クリップボードコピー関数（モーダル内から呼ぶ） ──
  window.doClipboardCopy = function() {
    const urlText = document.getElementById('invite-url-text');
    if(!urlText) return;
    const text = urlText.textContent;

    // 方法①: Clipboard API（https必須・ユーザー操作直後なら許可される）
    if(navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(() => {
          const btn = document.getElementById('btn-copy');
          if(btn) { btn.textContent='✅ コピーしました！'; btn.style.background='#dcfce7'; btn.style.color='#16a34a'; btn.style.borderColor='#16a34a'; }
          setTimeout(()=>{ if(document.getElementById('url-modal')) {
            const b=document.getElementById('btn-copy'); if(b){b.textContent='📋 クリップボードにコピー';b.style.background='#f8fafc';b.style.color='#1e3a8a';b.style.borderColor='#1e3a8a';}
          }}, 2500);
        })
        .catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  };

  // 方法②: 旧来の execCommand（Safari 古いバージョン向け）
  window.fallbackCopy = function(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;width:1px;height:1px';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try {
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      const btn = document.getElementById('btn-copy');
      if(ok && btn) {
        btn.textContent='✅ コピーしました！'; btn.style.background='#dcfce7'; btn.style.color='#16a34a'; btn.style.borderColor='#16a34a';
      } else {
        // 全手段失敗 → 長押しを促す
        alert('自動コピーができませんでした。\n上のURLを長押しして「コピー」を選んでください。');
      }
    } catch(e) {
      document.body.removeChild(ta);
      alert('自動コピーができませんでした。\n上のURLを長押しして「コピー」を選んでください。');
    }
  };
}

// ネイティブ共有シート（iOS/Android）
window.doNativeShare = function(url, wsName) {
  if(!navigator.share) return;
  navigator.share({
    title: 'Skill Map 参加招待',
    text:  (wsName ? '【'+wsName+'】' : '') + 'に招待します。URLをタップして参加してください。',
    url,
  }).catch(()=>{}); // キャンセルは無視
};

function switchTab(id) {
  state.activeTab = id;
  // update tab bar active state
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.textContent.trim().startsWith(
      {members:'従業員',approvals:'承認',heatmap:'ヒート',criteria:'評価',mypage:'マイ',quests:'クエ'}[id]||id
    ));
  });
  // Re-render correctly
  const admin = isAdmin();
  const ws = getWS();
  const pending = (ws.approvals||[]).filter(a=>a.status==='pending').length;
  const adminTabs=[{id:'members',label:'従業員一覧'},{id:'approvals',label:'承認管理',badge:pending},{id:'heatmap',label:'ヒートマップ'},{id:'criteria',label:'評価基準'}];
  const empTabs=[{id:'mypage',label:'マイページ'},{id:'quests',label:'クエスト'},{id:'criteria',label:'評価基準'}];
  const tabs=admin?adminTabs:empTabs;
  document.getElementById('tab-bar').innerHTML=tabs.map(t=>`<button class="tab-btn${state.activeTab===t.id?' active':''}" onclick="switchTab('${t.id}')">
    ${t.label}${t.badge>0?`<span class="badge">${t.badge}</span>`:''}
  </button>`).join('');
  renderTabContent();
}

async function renderTabContent() {
  const el = document.getElementById('tab-content');
  if(!el) return;
  const admin = isAdmin();
  if(state.activeTab==='members' && admin)        el.innerHTML = renderMembers();
  else if(state.activeTab==='approvals' && admin) el.innerHTML = renderApprovals();
  else if(state.activeTab==='heatmap' && admin)   el.innerHTML = renderHeatmap();
  else if(state.activeTab==='criteria')           el.innerHTML = renderCriteria();
  else if(state.activeTab==='mypage' && !admin)   el.innerHTML = await renderMyPage();
  else if(state.activeTab==='quests' && !admin)   el.innerHTML = renderQuestsPlayer();
  else el.innerHTML = `<div class="page"><p style="color:#94a3b8">このページは表示できません</p></div>`;
}

// QUESTS (employee view)
// ════════════════════════════════════════════════════════════════
function renderQuestsPlayer() {
  const me  = getMe();
  if(!me) return '';
  const ws  = getWS();
  const quests = ws.quests||[];
  const approvals = ws.approvals||[];

  const active = SKILLS.map(skill=>{
    const currentLv = me.skills[skill.id]||1;
    const targetLv  = currentLv+1;
    if(targetLv>5) return null;
    const qs = quests.filter(q=>q.skillId===skill.id && q.targetLevel===targetLv);
    if(!qs.length) return null;
    return {skill, currentLv, targetLv, qs};
  }).filter(Boolean);

  if(!active.length) return `<div class="page">
    <div class="card" style="text-align:center;padding:32px">
      <div style="font-size:40px;margin-bottom:8px">⚔️</div>
      <div style="font-weight:700;color:#64748b">現在挑戦中のクエストはありません</div>
      <div style="font-size:12px;color:#94a3b8;margin-top:4px">管理者がクエストを設定するとここに表示されます</div>
    </div>
  </div>`;

  return `<div class="page">
    <div class="card-title" style="padding:4px 0 12px">現在挑戦中のクエスト</div>
    ${active.map(({skill,currentLv,targetLv,qs})=>`
      <div class="card" style="border-color:${skill.color}40">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
          <span style="font-weight:900;font-size:12px;background:${skill.color};color:#fff;padding:3px 8px;border-radius:99px">${skill.short}</span>
          <span style="font-weight:700">${skill.label}</span>
          <span style="margin-left:auto;font-size:12px;color:${skill.color};font-weight:700">Lv.${currentLv} → Lv.${targetLv}</span>
        </div>
        ${qs.map(q=>{
          const apv = [...approvals].reverse().find(a=>a.employeeId===me.id&&a.questId===q.id);
          const isPending  = apv&&apv.status==='pending';
          const isApproved = apv&&apv.status==='approved';
          const isRejected = apv&&apv.status==='rejected';
          return `<div class="quest-card" style="border-color:${isApproved?'#16a34a':isPending?'#f59e0b':skill.color}30;background:${isApproved?'#f0fdf4':isPending?'#fffbeb':'#fff'}">
            <div style="font-weight:700;font-size:14px">${esc(q.title)}</div>
            ${q.description?`<div style="font-size:12px;color:#64748b;margin-top:4px">${esc(q.description)}</div>`:''}
            ${isApproved?`<div class="quest-status" style="background:#dcfce7;color:#16a34a">✅ 承認済み・レベルアップ完了！</div>`:''}
            ${isPending ?`<div class="quest-status" style="background:#fef9c3;color:#854d0e">⏳ 承認待ち中…</div>`:''}
            ${isRejected?`<div>
              <div class="quest-status" style="background:#fee2e2;color:#dc2626">❌ 差し戻し — 再申請できます</div>
              ${apv.comment?`<div style="font-size:11px;color:#64748b;margin-top:4px">💬 ${esc(apv.comment)}</div>`:''}
            </div>`:''}
            ${!isApproved&&!isPending?`<button class="btn btn-sm" style="width:100%;justify-content:center;margin-top:8px;background:${skill.color}18;color:${skill.color};border:1px solid ${skill.color}40;border-radius:10px" onclick="requestApproval('${q.id}','${skill.id}',${targetLv})">
              📋 ${isRejected?'再度':''}クリアを申請する
            </button>`:''}
          </div>`;
        }).join('')}
      </div>`).join('')}
  </div>`;
}

    ${apvs.length===0?`<div class="card" style="text-align:center;padding:24px;color:#94a3b8">
      <div style="font-size:32px;margin-bottom:8px">✅</div>
      <div>現在、承認待ちの申請はありません</div>
    </div>`:''}
    ${apvs.map(apv=>{
      const emp   = getEmps().find(e=>e.id===apv.employeeId);
      const quest = (ws.quests||[]).find(q=>q.id===apv.questId);
      const skill = SKILLS.find(s=>s.id===apv.skillId);
      const meta  = LEVELS[apv.targetLevel-1];
      if(!emp||!quest||!skill) return '';
      const rank  = getRank(emp.skills);
      const tier  = parseInt(rank.code.replace('J',''))||1;
      return `<div class="card" style="border-color:#f59e0b40">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <div style="width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid ${rank.color}">${makeSvgAvatar(tier,44)}</div>
          <div>
            <div style="font-weight:900">${esc(emp.name)}</div>
            <div style="font-size:12px;color:#94a3b8">${esc(emp.role)}</div>
          </div>
          <div style="margin-left:auto;text-align:right">
            <div style="font-size:11px;font-weight:700;color:${skill.color}">${skill.label}</div>
            <div style="font-size:12px;font-weight:900">→ Lv.${apv.targetLevel} ${meta.icon} ${meta.name}</div>
          </div>
        </div>
        <div style="background:#f8fafc;border-radius:10px;padding:10px;margin-bottom:10px">
          <div style="font-size:12px;font-weight:700;margin-bottom:2px">⚔️ ${esc(quest.title)}</div>
          ${apv.comment?`<div style="font-size:11px;color:#64748b">💬 ${esc(apv.comment)}</div>`:''}
        </div>
        <textarea id="comment-${apv.id}" placeholder="管理者コメント（省略可）" class="input" rows="2" style="margin-bottom:8px"></textarea>
        <div style="display:flex;gap:8px">
          <button class="btn btn-green btn-sm" style="flex:1;justify-content:center" onclick="approveApv('${apv.id}')">👍 承認してレベルアップ</button>
          <button class="btn btn-sm" style="flex:1;justify-content:center;background:#fee2e2;color:#dc2626;border-radius:8px" onclick="rejectApv('${apv.id}')">👎 差し戻し</button>
        </div>
      </div>`;
    }).join('')}
    ${all.filter(a=>a.status!=='pending').length>0?`
    <div class="card-title" style="margin-top:16px">処理済み</div>
    ${all.filter(a=>a.status!=='pending').slice(0,5).map(apv=>{
      const emp=getEmps().find(e=>e.id===apv.employeeId);
      const skill=SKILLS.find(s=>s.id===apv.skillId);
      if(!emp||!skill) return '';
      return `<div class="card" style="padding:10px;border-color:${apv.status==='approved'?'#16a34a':'#dc2626'}30">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-size:13px;font-weight:700">${esc(emp.name)} — ${skill.label} Lv.${apv.targetLevel}</div>
          <span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:${apv.status==='approved'?'#dcfce7':'#fee2e2'};color:${apv.status==='approved'?'#16a34a':'#dc2626'}">${apv.status==='approved'?'承認済':'差戻'}</span>
        </div>
      </div>`;
    }).join('')}`:''}
  </div>`;
}

// ════════════════════════════════════════════════════════════════
// HEATMAP (admin)
// ════════════════════════════════════════════════════════════════
function renderHeatmap() {
  const emps = getEmps();
  const header = SKILLS.map(s=>`<th style="min-width:80px;padding:8px 4px">${s.short}<br><span style="font-size:9px;opacity:.7">${s.label.slice(0,6)}</span></th>`).join('');
  const rows = emps.map(emp=>{
    const rank=getRank(emp.skills);
    const cells=SKILLS.map(s=>{
      const lv=emp.skills[s.id]||0;
      const h=HEAT[lv];
      return `<td><div class="heat-cell" style="background:${h.bg};color:${h.text}">${lv||'—'}</div></td>`;
    }).join('');
    return `<tr>
      <td style="font-size:12px;font-weight:700;white-space:nowrap;padding:8px">${esc(emp.name)}<br><span style="font-size:10px;color:#94a3b8;font-weight:400">${rank.code}</span></td>
      ${cells}
    </tr>`;
  }).join('');

  const avgRow = SKILLS.map(s=>{
    const vals=emps.map(e=>e.skills[s.id]||0);
    const avg=vals.reduce((a,b)=>a+b,0)/Math.max(vals.length,1);
    const h=HEAT[Math.round(avg)];
    return `<td><div class="heat-cell" style="background:${h.bg};color:${h.text};font-size:12px">${avg.toFixed(1)}</div></td>`;
  }).join('');

  const hiRow = SKILLS.map(s=>{
    const hi=emps.filter(e=>(e.skills[s.id]||0)>=4).length;
    return `<td style="text-align:center;font-size:12px;font-weight:900;color:${hi===0?'#dc2626':hi>=2?'#16a34a':'#d97706'}">${hi}名${hi===0?'<br><span style="font-size:9px">⚠要育成</span>':''}</td>`;
  }).join('');

  return `<div class="page">
    <div class="card-title">スキルヒートマップ（管理者専用）</div>
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
      <table class="heatmap-table">
        <thead><tr><th style="text-align:left;min-width:100px">メンバー</th>${header}</tr></thead>
        <tbody>${rows}</tbody>
        <tfoot>
          <tr style="background:#f0fdf4">
            <td style="font-weight:700;font-size:12px;color:#16a34a">平均 Lv</td>${avgRow}
          </tr>
          <tr style="background:#eff6ff">
            <td style="font-weight:700;font-size:12px;color:#1e3a8a">Lv.4+人数</td>${hiRow}
          </tr>
        </tfoot>
      </table>
    </div>
    <div style="font-size:11px;color:#94a3b8;margin-top:8px">⚠ 赤字「要育成」= Lv.4以上のメンバーが0人</div>
  </div>`;
}

function showInvitePopup() {
  const ws = getWS();
  const existing = document.getElementById('invite-popup');
  if(existing) { existing.remove(); return; }
  const div = document.createElement('div');
  div.id = 'invite-popup';
  div.style.cssText='position:fixed;top:60px;right:12px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.15);min-width:220px';
  div.innerHTML=`
    <div style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">社員を招待</div>
    <button class="btn btn-primary btn-sm" style="width:100%;justify-content:center;margin-bottom:8px;padding:12px" onclick="copyInviteUrl()">

    </button>
    <div style="background:#f8fafc;border-radius:8px;padding:10px;text-align:center;margin-bottom:6px">

// ════════════════════════════════════════════════════════════════
// ACTIONS (mutations)
// ════════════════════════════════════════════════════════════════
function selectMember(id) {
  state.selectedEmpId = id;
  renderTabContent();
}

function showAddMember() {
  document.getElementById('add-member-form').classList.remove('hidden');
}
function hideAddMember() {
  document.getElementById('add-member-form').classList.add('hidden');
}

function addMember() {
  if(!isAdmin()) return;
  const name = document.getElementById('new-name').value.trim();
  const role = document.getElementById('new-role').value.trim() || 'スタッフ';
  if(!name) { toast('名前を入力してください'); return; }
  const ws = getWS();
  const emp = {id:nextId++, name, role, wsRole:'employee', skills:defaultSkills()};
  ws.employees.push(emp);
  saveWS();
  toast(name+'を追加しました');
  state.selectedEmpId = emp.id;
  renderTabContent();
}

function deleteMember(id) {
  if(!isAdmin()) return;
  if(!confirm('このメンバーを削除しますか？')) return;
  const ws = getWS();
  ws.employees = ws.employees.filter(e=>e.id!==id);
  if(state.selectedEmpId===id) state.selectedEmpId = (ws.employees[0]||{}).id;
  saveWS();
  renderTabContent();
}

function promoteToAdmin(id) {
  if(!isAdmin()) return;
  if(!confirm('このメンバーを管理者に昇格しますか？')) return;
  const ws = getWS();
  ws.employees = ws.employees.map(e=>e.id===id?{...e,wsRole:'admin'}:e);
  saveWS();
  toast('管理者に昇格しました');
  renderTabContent();
}

function changeSkill(empId, skillId, delta) {
  if(!isAdmin()) return;
  const ws = getWS();
  const emp = ws.employees.find(e=>e.id===empId);
  if(!emp) return;
  const cur = emp.skills[skillId]||1;
  const nv  = Math.min(5, Math.max(1, cur+delta));
  if(nv===cur) return;
  emp.skills[skillId] = nv;
  saveWS();
  // Write log
  const skill = SKILLS.find(s=>s.id===skillId);
  const meta  = LEVELS[nv-1];
  const now   = new Date();
  const ds=`${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
  const ts=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  db.appendLog(state.ws.id, empId, {id:empId+'-'+Date.now(), date:ds, time:ts,
    skillId, skillLabel:skill.label, newLevel:nv, oldLevel:cur,
    levelName:meta.name, levelIcon:meta.icon, dir:delta>0?'up':'down'});
  renderTabContent();
}

function requestApproval(questId, skillId, targetLevel) {
  if(isAdmin()) return;
  const ws   = getWS();
  const me   = getMe();
  ws.approvals = ws.approvals||[];
  // Block duplicate pending/approved
  const ex = [...ws.approvals].reverse().find(a=>a.employeeId===me.id&&a.questId===questId);
  if(ex&&(ex.status==='pending'||ex.status==='approved')) { toast('すでに申請中または承認済みです'); return; }
  ws.approvals.push({
    id:'apv_'+Date.now(), questId, employeeId:me.id,
    skillId, targetLevel, status:'pending', comment:'',
    requestedAt:Date.now(), reviewedAt:null, reviewedBy:null,
  });
  saveWS();
  toast('クリア申請を送りました！');
  renderTabContent();
}

function approveApv(apvId) {
  if(!isAdmin()) return;
  const ws  = getWS();
  const me  = getMe();
  const apv = ws.approvals.find(a=>a.id===apvId);
  if(!apv) return;
  const comment = (document.getElementById('comment-'+apvId)||{}).value||'';
  apv.status='approved'; apv.comment=comment; apv.reviewedAt=Date.now(); apv.reviewedBy=me.id;
  // Level up the employee
  const emp = ws.employees.find(e=>e.id===apv.employeeId);
  if(emp && (emp.skills[apv.skillId]||1) < apv.targetLevel) {
    const oldLv = emp.skills[apv.skillId]||1;
    emp.skills[apv.skillId] = apv.targetLevel;
    const skill=SKILLS.find(s=>s.id===apv.skillId);
    const meta=LEVELS[apv.targetLevel-1];
    const now=new Date();
    const ds=`${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
    const ts=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    db.appendLog(state.ws.id, emp.id, {id:emp.id+'-'+Date.now(),date:ds,time:ts,
      skillId:apv.skillId,skillLabel:skill.label,newLevel:apv.targetLevel,oldLevel:oldLv,
      levelName:meta.name,levelIcon:meta.icon,dir:'up'});
  }
  saveWS();
  toast('承認しました！スキルがレベルアップしました🎉');
  renderApp();
}

function rejectApv(apvId) {
  if(!isAdmin()) return;
  const ws  = getWS();
  const me  = getMe();
  const apv = ws.approvals.find(a=>a.id===apvId);
  if(!apv) return;
  const comment = (document.getElementById('comment-'+apvId)||{}).value||'差し戻し';
  apv.status='rejected'; apv.comment=comment; apv.reviewedAt=Date.now(); apv.reviewedBy=me.id;
  saveWS();
  toast('差し戻しました');
  renderTabContent();
}

function doLogout() {
  if(_unsubscribeWS) { _unsubscribeWS(); _unsubscribeWS = null; }
  db.clearSes();
  state.session=null; state.ws=null; state.screen='landing';
  rerender();
}

function doHardReset() {
  if(!confirm('セッションをリセットしますか？（Firestoreのデータは削除されません）')) return;
  if(_unsubscribeWS) { _unsubscribeWS(); _unsubscribeWS = null; }
  db.hardReset();
  localStorage.removeItem('sm_recent_ws');
  state.session=null; state.ws=null; state.screen='landing';
  rerender();
}

// ════════════════════════════════════════════════════════════════
// UTIL
// ════════════════════════════════════════════════════════════════
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
